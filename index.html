<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d6672">
<title>Hoja de Vida de Máquinas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
/* Layout: barra superior de estado → plano de planta (SVG) → lista de alertas; ficha de máquina en panel lateral con 3 pestañas */
:root{
  --bg:#eef1f2; --surface:#ffffff; --floor:#f6f8f8; --grid:#dfe5e6; --line:#c9d2d4;
  --fg:#1b2427; --muted:#5d6b70; --accent:#0d6672; --accent-soft:#d8ecee;
  --machine:#e4eaeb; --machine-stroke:#6f8186; --tank:#ffffff;
  --ok:#2f7d4f; --ok-soft:#dcefe3; --warn:#b26a00; --warn-soft:#fbecd2; --bad:#c2352b; --bad-soft:#f8dedb; --none:#8a979b; --none-soft:#e8ecec;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121819; --surface:#1a2224; --floor:#161d1f; --grid:#232d30; --line:#2f3b3e;
  --fg:#e5ecee; --muted:#93a3a8; --accent:#4fb3bf; --accent-soft:#183a3f;
  --machine:#26312f; --machine-stroke:#7d9095; --tank:#1a2224;
  --ok:#5cc188; --ok-soft:#173326; --warn:#e5a33c; --warn-soft:#3a2b12; --bad:#f06b5f; --bad-soft:#3d1c19; --none:#7f8d91; --none-soft:#242d30; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121819; --surface:#1a2224; --floor:#161d1f; --grid:#232d30; --line:#2f3b3e;
  --fg:#e5ecee; --muted:#93a3a8; --accent:#4fb3bf; --accent-soft:#183a3f;
  --machine:#26312f; --machine-stroke:#7d9095; --tank:#1a2224;
  --ok:#5cc188; --ok-soft:#173326; --warn:#e5a33c; --warn-soft:#3a2b12; --bad:#f06b5f; --bad-soft:#3d1c19; --none:#7f8d91; --none-soft:#242d30; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
.wrap{max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance}
h1{font-size:30px;line-height:1.05}
h2{font-size:20px}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;font-weight:500;font-size:14px;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.btn.danger{color:var(--bad)}
.btn.small{padding:4px 9px;font-size:13px}

header.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
.tools{display:flex;flex-wrap:wrap;gap:8px}
.stats{display:flex;flex-wrap:wrap;gap:8px}
.stat{display:flex;align-items:baseline;gap:8px;padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13px}
.stat b{font-family:var(--f-mono);font-size:15px;font-variant-numeric:tabular-nums}
.stat.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.stat.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.banner{background:var(--accent-soft);color:var(--fg);border-radius:8px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;font-size:14px}

.plan-card{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.plan-head{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.plan-scroll{overflow-x:auto}
#plan{display:block;width:100%;max-width:980px;margin:0 auto;min-width:560px;height:auto;background:var(--floor);touch-action:none}
#plan.editing{cursor:grab}
.m-body{fill:var(--machine);stroke:var(--machine-stroke);stroke-width:1.5}
.m-tank{fill:var(--tank);stroke:var(--machine-stroke);stroke-width:1.2}
.m-rope{stroke:var(--machine-stroke);stroke-width:1;stroke-dasharray:3 3}
.m-name{font-family:var(--f-display);font-weight:700;fill:var(--fg)}
.wall{fill:none;stroke:var(--fg);stroke-width:3}
.st-bad-m .m-body{fill:var(--bad-soft);stroke:var(--bad)}
.st-warn-m .m-body{fill:var(--warn-soft);stroke:var(--warn)}
.flag circle{stroke:var(--surface);stroke-width:2}.flag-bad circle{fill:var(--bad)}.flag-warn circle{fill:var(--warn)}
.flag text{fill:#fff;font-family:var(--f-display);font-weight:700;font-size:17px}
.m-sub{font-family:var(--f-mono);font-size:10px;fill:var(--muted)}
.machine{cursor:pointer}
.machine:hover .m-body,.machine:focus .m-body{stroke:var(--accent);stroke-width:2.5}
.machine:focus{outline:none}
.m-status{stroke:var(--surface);stroke-width:2}
.st-ok{fill:var(--ok)} .st-warn{fill:var(--warn)} .st-bad{fill:var(--bad)} .st-none{fill:var(--none)}
.alarm-ring{fill:none;stroke:var(--bad);stroke-width:3}
@media (prefers-reduced-motion:no-preference){.alarm-ring{animation:pulse 1.6s ease-in-out infinite}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

.empty{color:var(--muted);font-size:14px;padding:6px 0}

/* Panel lateral */
.scrim{position:fixed;inset:0;background:rgba(10,16,18,.45);z-index:20}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(680px,100%);background:var(--surface);z-index:21;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.18);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.panel-head{padding:16px 20px 0;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.panel-head h2{font-size:26px}
.x{border:none;background:none;font-size:26px;line-height:1;color:var(--muted);padding:2px 6px}
.tabs{display:flex;gap:2px;padding:12px 20px 0;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border:none;background:none;padding:9px 12px;font-family:var(--f-display);font-weight:600;font-size:16px;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tab .pill{font-family:var(--f-mono);font-size:11px;background:var(--bg);border-radius:999px;padding:1px 6px;margin-left:4px}
.panel-body{flex:1;overflow-y:auto;padding:18px 20px 24px;display:flex;flex-direction:column;gap:16px}
.photo{aspect-ratio:4/3;max-width:100%;width:100%;border-radius:8px;background:var(--bg);border:1px dashed var(--line);display:grid;place-items:center;overflow:hidden;color:var(--muted);font-size:14px;text-align:center;padding:0}
.photo img{width:100%;height:100%;object-fit:cover}
.specs{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.spec{padding:10px 12px;border-bottom:1px solid var(--line);min-width:0}
.spec:nth-child(odd){border-right:1px solid var(--line)}
.spec:nth-last-child(-n+2){border-bottom:none}
.spec .k{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.spec .v{font-size:17px;font-weight:600;overflow-wrap:anywhere}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.end{justify-content:flex-end}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12.5px;color:var(--muted);font-weight:500}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:8px 10px;width:100%}
.field textarea{min-height:60px;resize:vertical}
.boxed{border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:12px}
table{border-collapse:collapse;width:100%;font-size:14px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
th{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:500;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--bg)}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}
td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.status-big{border-radius:10px;padding:16px;display:flex;gap:16px;align-items:center}
.status-big .n{font-family:var(--f-mono);font-size:40px;font-weight:500;line-height:1;font-variant-numeric:tabular-nums}
.status-big.ok{background:var(--ok-soft);color:var(--ok)} .status-big.warn{background:var(--warn-soft);color:var(--warn)} .status-big.bad{background:var(--bad-soft);color:var(--bad)} .status-big.none{background:var(--none-soft);color:var(--muted)}
.status-big p{margin:0;color:var(--fg);font-size:14px}
.status-big strong{display:block;font-family:var(--f-display);font-size:19px}
.progress{height:8px;border-radius:99px;background:var(--bg);overflow:hidden}
.progress span{display:block;height:100%;background:currentColor}
.kpis{display:flex;flex-wrap:wrap;gap:8px}
.kpi{flex:1 1 120px;background:var(--bg);border-radius:8px;padding:8px 12px}
.kpi b{font-family:var(--f-mono);font-size:20px;font-weight:500;display:block;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted)}

/* Modal genérico */
.modal{position:fixed;z-index:31;left:50%;top:50%;transform:translate(-50%,-50%);width:min(640px,calc(100% - 32px));max-height:calc(100% - 48px);overflow:auto;background:var(--surface);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal-scrim{z-index:30}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:8px;z-index:40;font-size:14px}
.muted{color:var(--muted)}
.hint{font-size:13px;color:var(--muted);margin:0}
@media (max-width:520px){.form{grid-template-columns:1fr}.specs{grid-template-columns:1fr}.spec:nth-child(odd){border-right:none}.spec:nth-last-child(2){border-bottom:1px solid var(--line)}h1{font-size:25px}}

:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.top-right{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:flex-end}
.userbox{display:flex;gap:8px;align-items:center}
.who{font-size:14px;color:var(--muted)} .who b{color:var(--fg)}
.banner.warnb{background:var(--warn-soft);color:var(--fg)}
.btn:disabled{opacity:.6;cursor:wait}
.gen{display:flex;flex-direction:column;gap:14px}
.gen-head h2{font-size:24px}
.gen-head .hint{margin-top:2px}
#genBody{display:flex;flex-direction:column;gap:16px}
.gkpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.gkpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.gkpi .lbl{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.gkpi b{font-family:var(--f-display);font-size:28px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.gkpi b.txt{font-size:22px}
.gkpi b .mlink{font-size:inherit;font-weight:inherit}
.gkpi small{color:var(--muted);font-size:12.5px}
.dl{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.dl.up,td.up{color:var(--bad)} .dl.down,td.down{color:var(--ok)}
.ggrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:16px;align-items:start}
.gcol{display:flex;flex-direction:column;gap:16px;min-width:0}
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.gcard-head{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;justify-content:space-between}
.gcard-head h3{font-size:19px}
.findings{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.findings li{display:flex;flex-direction:column;gap:3px;padding:9px 12px;border-radius:8px;background:var(--bg);border-left:4px solid var(--none)}
.findings li p{margin:0;font-size:14.5px;line-height:1.45}
.findings .more{margin:2px 0 0;padding-left:18px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:1px}
.findings .more li,.findings li.bad .more li,.findings li.warn .more li,.findings li.good .more li{display:list-item;list-style:disc;background:none;border:none;padding:0;border-radius:0}
.findings .tag{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.findings li.bad{border-left-color:var(--bad);background:var(--bad-soft)} .findings li.bad .tag{color:var(--bad)}
.findings li.warn{border-left-color:var(--warn);background:var(--warn-soft)} .findings li.warn .tag{color:var(--warn)}
.findings li.good{border-left-color:var(--ok);background:var(--ok-soft)} .findings li.good .tag{color:var(--ok)}
.findings li.info{border-left-color:var(--accent)} .findings li.info .tag{color:var(--accent)}
.mlink{border:none;background:none;padding:0;font:inherit;font-weight:600;color:var(--accent);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:2px;cursor:pointer}
.chips{display:flex;gap:4px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:12.5px;color:var(--muted)}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.rank table{font-size:14px}
.rank td{vertical-align:middle;padding:7px 10px}
.rank tbody tr{cursor:pointer}
.rank tbody tr:hover td{background:var(--bg)}
.rank th.r,.rank td.r{text-align:right}
.rank td:nth-child(3){width:38%;min-width:130px}
.rank td:first-child{white-space:nowrap}
.hbar{position:relative;height:20px;background:var(--bg);border-radius:4px;overflow:hidden}
.hbar span{position:absolute;inset:0 auto 0 0;background:var(--accent);opacity:.28;border-radius:4px}
.hbar.muted span{background:var(--none)}
.hbar em{position:relative;font-style:normal;font-family:var(--f-mono);font-size:12px;line-height:20px;padding-left:6px;white-space:nowrap;font-variant-numeric:tabular-nums}
.causes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.causes li{display:grid;grid-template-columns:minmax(120px,40%) 1fr;gap:10px;align-items:center}
.cl{display:flex;flex-direction:column;min-width:0}
.cl b{font-size:14px;font-weight:600}
.cl span{font-size:12px;color:var(--muted)}
@media (max-width:900px){.ggrid{grid-template-columns:1fr}}
@media (max-width:520px){.causes li{grid-template-columns:1fr;gap:4px}.gkpi b{font-size:24px}}
.hist{display:flex;flex-direction:column;gap:10px}
.hist-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.hist-head h3,.insights h3{font-size:19px}
.add-btn{width:34px;height:34px;padding:0;justify-content:center;font-size:22px;line-height:1;border-radius:50%;background:var(--accent);border-color:var(--accent);color:var(--surface)}
.add-btn.on{background:var(--surface);color:var(--muted);border-color:var(--line)}
.mini-form{display:grid;grid-template-columns:150px 90px 1fr;gap:8px 10px;align-items:end;background:var(--bg);border-radius:8px;padding:10px 12px}
.mini-form .wide{grid-column:span 1}
.mini-form .field:nth-child(3){grid-column:3}
.mini-form .field:nth-child(4){grid-column:1/3}
.mini-form .field label{font-size:11.5px}
.mini-form .field input{padding:5px 8px;font-size:14px;background:var(--surface)}
.mini-actions{display:flex;gap:6px;justify-content:flex-end;grid-column:3}
.hist-tbl{border-color:var(--line)}
.hist-tbl table{font-size:14.5px}
.hist-tbl td{padding:9px 10px}
.hist-tbl td.falla{width:100%}
.hist-tbl td.falla small{display:block;margin-top:2px}
.hist-tbl tr.cur td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.hist-tbl th.r,.hist-tbl td.r{text-align:right}
.hist-tbl td.del{padding:6px 6px 0 0;width:1%}
.icon-del{border:none;background:none;color:var(--muted);font-size:18px;line-height:1;padding:4px 6px;border-radius:4px;opacity:.55}
.icon-del:hover,.icon-del:focus-visible{color:var(--bad);background:var(--bad-soft);opacity:1}
.insights{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:8px}
.insights ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.insights li{font-size:14px;padding:7px 10px 7px 12px;border-radius:6px;background:var(--bg);border-left:3px solid var(--none)}
.insights li.warn{border-left-color:var(--warn);background:var(--warn-soft)}
.insights li.bad{border-left-color:var(--bad);background:var(--bad-soft)}
@media (max-width:520px){.mini-form{grid-template-columns:1fr 1fr}.mini-form .field:nth-child(3),.mini-form .field:nth-child(4){grid-column:1/-1}.mini-actions{grid-column:1/-1}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">Tintorería · Planta</div>
      <h1>Hoja de vida de máquinas</h1>
    </div>
    <div class="top-right">
      <div class="stats" id="stats"></div>
      <div class="userbox" id="userbox"></div>
    </div>
  </header>

  <div class="banner warnb" id="netBanner" hidden></div>

  <section class="plan-card">
    <div class="plan-head">
      <div class="legend">
        <span><i style="background:var(--ok)"></i>Pasivado al día</span>
        <span><i style="background:var(--warn)"></i>Vence en ≤ 30 días</span>
        <span><i style="background:var(--bad)"></i>Le toca lavado pasivado</span>
        <span><i style="background:var(--none)"></i>Sin registro</span>
      </div>
      <div class="tools">
        <button class="btn" id="btnEdit" aria-pressed="false" data-auth>Mover máquinas</button>
        <button class="btn" id="btnAdd" data-auth>+ Agregar máquina</button>
        <button class="btn" id="btnImport" data-auth>Importar Excel de daños</button>
        <button class="btn" id="btnExport">Descargar Excel</button>
      </div>
    </div>
    <div class="plan-scroll">
      <svg id="plan" viewBox="0 0 1050 830" role="img" aria-label="Plano de planta con las máquinas"></svg>
    </div>
  </section>

  <section class="gen" id="general" aria-labelledby="genTitle">
    <div class="gen-head">
      <div><h2 id="genTitle">Análisis general de la planta</h2><p class="hint" id="genSub">Calculado con todo el historial de mantenimientos.</p></div>
    </div>
    <div id="genBody"><p class="empty">Cargando información…</p></div>
  </section>
</div>

<div class="scrim" id="scrim" hidden></div>
<aside class="panel" id="panel" hidden aria-modal="true" role="dialog" aria-labelledby="pTitle">
  <div class="panel-head">
    <div><div class="eyebrow" id="pEyebrow"></div><h2 id="pTitle"></h2></div>

/* ---------- Estado de lavado pasivado ---------- */
function lastPas(id){let b=null;for(const p of S.pasivados)if(p.maquinaId===id&&(!b||p.fecha>b.fecha))b=p;return b}
function pasStatus(id){
  const p=lastPas(id); if(!p)return {k:'none',label:'Sin registro'};
  const today=parseISO(todayISO()), due=addYear(p.fecha), left=daysBetween(today,due), since=daysBetween(parseISO(p.fecha),today);
  const k=left<=0?'bad':left<=30?'warn':'ok';
  return {k,left,since,due,last:p.fecha,label:k==='bad'?(left===0?'Vence hoy':'Vencido hace '+(-left)+' d'):left+' días restantes'};
}

/* ---------- Plano ---------- */

function machineSVG(m){
  const st=pasStatus(m.id), W=m.w||150, H=m.h||100, t=Math.max(0,+m.tanques||0), c=Math.max(0,+m.cuerdas||0), vert=H>W;

  const nc=Math.min(c,6);
  for(let i=0;i<nc;i++){const f=(i+1)/(nc+1);g+=vert?`<line class="m-rope" y1="12" y2="${H-12}" x1="${W*f}" x2="${W*f}"/>`:`<line class="m-rope" x1="12" x2="${W-12}" y1="${H*f}" y2="${H*f}"/>`}
  const nt=Math.min(t,Math.floor((W-12)/18));
  for(let i=0;i<nt;i++){g+=`<circle class="m-tank" cx="${W-14-i*18}" cy="0" r="7"/>`}
  const fs=Math.max(18,Math.min(30,W*0.36,H*0.36)), lab=String(label(m)), size=lab.length>4?Math.min(fs,W/(lab.length*0.62)):fs;
  g+=`<text class="m-name" x="${W/2}" y="${H/2}" text-anchor="middle" dominant-baseline="central" style="font-size:${size.toFixed(1)}px">${esc(lab)}</text>`;

  return g+'</g>';
}

/* ---------- Análisis general de la planta ---------- */
let genPeriod=90, genAll=false, genRankAll=false;
const pct=(a,b)=>b?Math.round(a/b*100):0;
const dec=(n,d=1)=>(+n).toFixed(d).replace('.',',').replace(/,0$/,'');
function mlink(m){return `<button class="mlink" data-open="${m.id}">${esc(m.nombre)}</button>`}
function shortList(ms){const n=ms.map(m=>m.codigo||m.nombre);return n.length<=1?n.join(''):n.slice(0,-1).join(', ')+' y '+n[n.length-1]}

function analisisGeneral(){
  const hoy=parseISO(todayISO()), ym=todayISO().slice(0,7);
  const age=x=>daysBetween(parseISO(x.fecha),hoy);
  const M=new Map(S.machines.map(m=>[m.id,m]));
  const by=new Map(S.machines.map(m=>[m.id,[]]));
  S.mantenimientos.forEach(x=>{if(by.has(x.maquinaId))by.get(x.maquinaId).push(x)});
  const all=S.mantenimientos.filter(x=>M.has(x.maquinaId));
  const out=[]; const used=new Set();
  if(!all.length)return out;

  // 1. Misma causa repetida este mes / mismo componente en 30 días
  by.forEach((l,id)=>{const m=M.get(id);
    const mes=l.filter(x=>String(x.fecha).startsWith(ym)&&!SINJ.test(norm(x.falla)));
    const ex=new Map();mes.forEach(x=>{const k=norm(x.falla);ex.set(k,(ex.get(k)||[]).concat(x))});
    const top=[...ex.values()].sort((a,b)=>b.length-a.length)[0];
    if(top&&top.length>=2){const h=top.reduce((s,x)=>s+horas(x),0);
      out.push({k:'bad',sc:75+Math.min(30,h)+top.length,id,t:`${mlink(m)} se ha entregado ${top.length} veces este mes por la misma causa: <b>${esc(sentence(top[0].falla))}</b> (${fmtH(h)} de parada). Revisar la causa de fondo antes de que vuelva a fallar.`,s:`Repite causa este mes: ${esc(sentence(top[0].falla).toLowerCase())}, ${top.length} veces.`});used.add(id+'rep');return}
    const r30=l.filter(x=>age(x)<=30);const cc=new Map();r30.forEach(x=>{const c=mainCat(x.falla);if(isComp(c))cc.set(c,(cc.get(c)||[]).concat(x))});
    const tc=[...cc].sort((a,b)=>b[1].length-a[1].length)[0];
    if(tc&&tc[1].length>=3){out.push({k:'bad',sc:98,id,t:`${mlink(m)} entró ${tc[1].length} veces en los últimos 30 días por problemas en <b>${esc(tc[0])}</b>.`,s:`${tc[1].length} fallas de ${esc(shortCat(tc[0]).toLowerCase())} en 30 días.`});used.add(id+'rep')}
  });

  // 2. Máquina + causa con más horas de parada en los últimos 60 días
  const mc=new Map();all.filter(x=>age(x)<=60).forEach(x=>{const c=mainCat(x.falla);if(!isComp(c))return;const k=x.maquinaId+'|'+c;const o=mc.get(k)||{id:x.maquinaId,c,h:0,n:0};o.h+=horas(x);o.n++;mc.set(k,o)});
  const topMC=[...mc.values()].sort((a,b)=>b.h-a.h).filter(o=>o.h>=6).slice(0,2);
  topMC.forEach((o,i)=>{const m=M.get(o.id);
    out.push({k:'warn',sc:i?78:88,id:o.id,t:i?`Le sigue ${mlink(m)} por <b>${esc(shortCat(o.c).toLowerCase())}</b>: ${fmtH(o.h)} en ${o.n} falla${o.n===1?'':'s'} en los últimos 2 meses.`
      :`Revisar ${mlink(m)} por <b>${esc(shortCat(o.c).toLowerCase())}</b>: es la combinación de máquina y causa que más horas de parada ha requerido en los últimos 2 meses (${fmtH(o.h)} en ${o.n} falla${o.n===1?'':'s'}).`,
      s:`${i?'Segunda':'Primera'} en horas de parada de la planta por ${esc(shortCat(o.c).toLowerCase())} en 2 meses: ${fmtH(o.h)}.`})});

  // 3. Paradas largas recientes
  all.filter(x=>age(x)<=30&&horas(x)>=20).sort((a,b)=>horas(b)-horas(a)).slice(0,2).forEach(x=>{const m=M.get(x.maquinaId);
    out.push({k:'bad',sc:82,id:x.maquinaId,t:`Parada larga en ${mlink(m)}: ${fmtH(horas(x))} el ${fmt(x.fecha)} por ${esc(sentence(x.falla).toLowerCase())}.`,s:`Parada larga de ${fmtH(horas(x))} el ${fmt(x.fecha)}.`})});

  // 4. Máquinas que están fallando más que su ritmo habitual
  const first=all.reduce((a,x)=>x.fecha<a?x.fecha:a,todayISO());
  const spanPrev=daysBetween(parseISO(first),hoy)-60;
  if(spanPrev>=60)by.forEach((l,id)=>{const cur=l.filter(x=>age(x)<=60).length, prev=l.filter(x=>age(x)>60).length;
    const rate=prev/(spanPrev/60);
    if(cur>=4&&cur>=rate*1.6){const m=M.get(id);out.push({k:'warn',sc:72+Math.min(10,cur),id,t:`${mlink(m)} está fallando más de lo normal: ${cur} fallas en los últimos 60 días, ${dec(cur/Math.max(rate,0.5))} veces su ritmo habitual (${dec(rate)} cada 60 días).`,s:`Falla más de lo normal: ${cur} fallas en 60 días, ${dec(cur/Math.max(rate,0.5))} veces su ritmo habitual.`})}});

  // 5. Máquinas propensas a un componente
  by.forEach((l,id)=>{if(l.length<6)return;const cc=new Map();l.forEach(x=>{const c=mainCat(x.falla);if(isComp(c))cc.set(c,(cc.get(c)||0)+1)});
    const t=[...cc].sort((a,b)=>b[1]-a[1])[0];if(!t)return;const p=pct(t[1],l.length);
    if(t[1]>=4&&p>=30){const m=M.get(id);out.push({k:'warn',sc:55+p/5,id,t:`${mlink(m)} es propensa a fallas en <b>${esc(t[0])}</b>: ${t[1]} de ${l.length} fallas (${p} %). Conviene incluir ese componente en su mantenimiento preventivo.`,s:`Propensa a fallas en ${esc(t[0])}: ${t[1]} de ${l.length} (${p} %).`})}});

  // 6. Causa que más horas de parada genera en la planta (90 días)
  const c90=new Map();let h90=0;all.filter(x=>age(x)<=90).forEach(x=>{const c=mainCat(x.falla),h=horas(x);h90+=h;if(!isComp(c))return;const o=c90.get(c)||{h:0,ids:new Map()};o.h+=h;o.ids.set(x.maquinaId,(o.ids.get(x.maquinaId)||0)+h);c90.set(c,o)});
  const tc90=[...c90].sort((a,b)=>b[1].h-a[1].h)[0];
  if(tc90&&h90){const ms=[...tc90[1].ids].sort((a,b)=>b[1]-a[1]).slice(0,3).map(([id])=>M.get(id));
    out.push({k:'info',sc:60,t:`En la planta, <b>${esc(tc90[0])}</b> es la causa que más horas de parada genera: ${fmtH(tc90[1].h)} en los últimos 90 días (${pct(tc90[1].h,h90)} % del total). Afecta sobre todo a ${ms.length>1?'las máquinas':'la máquina'} ${esc(shortList(ms))}.`})}

  // 7. Máquinas que mejoraron
  by.forEach((l,id)=>{if(l.length<6)return;const last=l.reduce((a,x)=>x.fecha>a?x.fecha:a,'');const d=daysBetween(parseISO(last),hoy);
    const span=daysBetween(parseISO(l.reduce((a,x)=>x.fecha<a?x.fecha:a,todayISO())),parseISO(last));const every=span/(l.length-1);
    if(d>=45&&d>=every*3){const m=M.get(id);out.push({k:'good',sc:20,id,t:`${mlink(m)} lleva ${d} días sin fallas. Antes fallaba cada ${Math.round(every)} días.`})}});

  // 8. Calidad del registro
  const sj=all.filter(x=>SINJ.test(norm(x.falla)));
  if(sj.length&&pct(sj.length,all.length)>=5){const cnt=new Map();sj.forEach(x=>cnt.set(x.maquinaId,(cnt.get(x.maquinaId)||0)+1));
    const ms=[...cnt].sort((a,b)=>b[1]-a[1]).slice(0,3).map(([id])=>M.get(id));
    out.push({k:'info',sc:12,t:`${sj.length} registros (${pct(sj.length,all.length)} %) están como "Sin justificación", sobre todo en las máquinas ${esc(shortList(ms))}. Detallar la causa hace este análisis más preciso.`})}

  out.sort((a,b)=>b.sc-a.sc);
  const g=[],byId=new Map();
  out.forEach(i=>{if(i.id&&byId.has(i.id)){byId.get(i.id).more.push(i.s||i.t);return}const o={...i,more:[]};g.push(o);if(i.id)byId.set(i.id,o)});
  return g;
}

function renderGeneral(){
  if(!loaded)return;
  const body=$('#genBody'), hoy=parseISO(todayISO()), ym=todayISO().slice(0,7);
  const all=S.mantenimientos.filter(x=>S.machines.some(m=>m.id===x.maquinaId));
  if(!all.length){body.innerHTML='<p class="empty">Aún no hay mantenimientos registrados. Importa el Excel de daños o registra fallas en cada máquina para ver el análisis.</p>';return}
  const age=x=>daysBetween(parseISO(x.fecha),hoy);
  const M=new Map(S.machines.map(m=>[m.id,m]));
  // Mes actual frente al mismo corte del mes anterior
  const d=hoy.getDate(), pm=new Date(hoy.getFullYear(),hoy.getMonth()-1,1), pym=pm.getFullYear()+'-'+String(pm.getMonth()+1).padStart(2,'0');
  const mes=all.filter(x=>String(x.fecha).startsWith(ym)), ant=all.filter(x=>String(x.fecha).startsWith(pym)&&+String(x.fecha).slice(8,10)<=d);
  const hMes=mes.reduce((s,x)=>s+horas(x),0), hAnt=ant.reduce((s,x)=>s+horas(x),0);
  const hm=new Map();mes.forEach(x=>hm.set(x.maquinaId,(hm.get(x.maquinaId)||0)+horas(x)));
  const topM=[...hm].sort((a,b)=>b[1]-a[1])[0];

  body.innerHTML=kpis+`<div class="ggrid"><div class="gcol">${list}</div><div class="gcol">${rank}${causes}</div></div>`;
  $('#genSub').textContent=`Calculado con ${all.length} mantenimientos registrados. Se actualiza solo con cada registro.`;

/* ---------- Mantenimientos ---------- */
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const byNewest=(a,b)=>String(b.fecha).localeCompare(a.fecha)||String(b.creado||'').localeCompare(a.creado||'');
const horas=x=>x.tiempo===''||x.tiempo==null||isNaN(+x.tiempo)?0:+x.tiempo;
const fmtH=h=>(Math.round(h*10)/10).toLocaleString('es-CO')+' h';
const sentence=t=>{t=String(t||'').trim().toLowerCase();return t.charAt(0).toUpperCase()+t.slice(1)};
// Componentes o sistemas reconocidos en el texto de la falla
const CATS=[
  ['el molinete interno',/molinete/],['la turbina',/turbina/],['la bomba principal',/bomba principal/],['la bomba auxiliar',/bomba auxiliar/],
  ['el intercambiador',/intercambiador/],['temperatura y vapor',/temperatura|calienta|vapor|enfriamiento/],['el llenado',/llenado|cuenta ?litros|celda/],
  ['la dosificación',/dosific/],['la introducción',/introduc/],['los sensores',/sensor/],['el drenaje',/drenaje/],
  ['los tanques',/tanque|transferencia|paso de bano/],['el PLC y la parte eléctrica',/\bplc\b|corto|variador|se apaga|electric|\bvx\b/],
  ['tapas, escotillas y visores',/tapa|escotilla|visor/],['inyectores y filtros',/inyector|tobera|filtro/]];
const SINJ=/sin justific/;
const CAT_SHORT={'el molinete interno':'Molinete interno','la turbina':'Turbina','la bomba principal':'Bomba principal','la bomba auxiliar':'Bomba auxiliar','el intercambiador':'Intercambiador','temperatura y vapor':'Temperatura y vapor','el llenado':'Llenado','la dosificación':'Dosificación','la introducción':'Introducción','los sensores':'Sensores','el drenaje':'Drenaje','los tanques':'Tanques','el PLC y la parte eléctrica':'PLC y eléctrico','tapas, escotillas y visores':'Tapas y visores','inyectores y filtros':'Inyectores y filtros'};
// Causa principal de una falla, para repartir horas sin contarlas dos veces
const mainCat=t=>{const n=norm(t);if(SINJ.test(n))return 'Sin justificación';const c=CATS.find(([,re])=>re.test(n));return c?c[0]:'Otras causas'};
const isComp=c=>c!=='Sin justificación'&&c!=='Otras causas';
const shortCat=c=>CAT_SHORT[c]||c;
const catsOf=t=>{const n=norm(t);return CATS.filter(([,re])=>re.test(n)).map(([c])=>c)};
let mantFormOpen=false;

function analisis(l){
  if(!l.length)return [];
  const out=[], hoy=parseISO(todayISO()), last=l[0], dLast=daysBetween(parseISO(last.fecha),hoy);
  out.push({k:'info',t:`Último mantenimiento hace ${dLast} día${dLast===1?'':'s'} (${fmt(last.fecha)}): ${sentence(last.falla)}.`});
  // Repeticiones en los últimos 30 días
  const rec=l.filter(x=>daysBetween(parseISO(x.fecha),hoy)<=30&&!SINJ.test(norm(x.falla)));
  const exact=new Map();rec.forEach(x=>{const k=norm(x.falla);exact.set(k,(exact.get(k)||0)+1)});
  const topExact=[...exact].sort((a,b)=>b[1]-a[1])[0];
  const catRec=new Map();rec.forEach(x=>catsOf(x.falla).forEach(c=>catRec.set(c,(catRec.get(c)||0)+1)));
  const topCatRec=[...catRec].sort((a,b)=>b[1]-a[1])[0];
  if(topExact&&topExact[1]>=2)out.push({k:'bad',t:`En los últimos 30 días se entregó a mantenimiento ${topExact[1]} veces por la misma causa: ${sentence(topExact[0])}.`});
  else if(topCatRec&&topCatRec[1]>=2)out.push({k:'bad',t:`En los últimos 30 días entró ${topCatRec[1]} veces por problemas en ${topCatRec[0]}.`});
  // Problema más frecuente en todo el historial
  const cat=new Map();l.forEach(x=>catsOf(x.falla).forEach(c=>cat.set(c,(cat.get(c)||0)+1)));
  const topCat=[...cat].sort((a,b)=>b[1]-a[1])[0];
  if(topCat&&topCat[1]>=3){const pct=Math.round(topCat[1]/l.length*100);
    const lc=l.find(x=>catsOf(x.falla).includes(topCat[0])), dc=daysBetween(parseISO(lc.fecha),hoy);
    out.push({k:pct>=30?'warn':'info',t:`Máquina generalmente con problemas en ${topCat[0]}: ${topCat[1]} de ${l.length} fallas (${pct} %). La última fue hace ${dc} día${dc===1?'':'s'}.`});}
  // Mes actual frente al promedio de los meses anteriores con registros
  const ym=todayISO().slice(0,7), mesN=MESES[hoy.getMonth()];
  const delMes=l.filter(x=>String(x.fecha).startsWith(ym));
  const prev=new Map();l.filter(x=>String(x.fecha).slice(0,7)<ym).forEach(x=>{const k=String(x.fecha).slice(0,7);prev.set(k,(prev.get(k)||0)+1)});
  const first=l[l.length-1].fecha.slice(0,7);
  let nMeses=0;{let [y,m]=first.split('-').map(Number);const [cy,cm]=ym.split('-').map(Number);nMeses=(cy-y)*12+(cm-m)}
  if(nMeses>=2){const prom=[...prev.values()].reduce((a,b)=>a+b,0)/nMeses;
    if(delMes.length>prom*1.5&&delMes.length>=2)out.push({k:'warn',t:`En ${mesN} lleva ${delMes.length} fallas, por encima de su promedio de ${prom.toFixed(1).replace('.',',')} por mes.`});
    else out.push({k:'info',t:`En ${mesN} lleva ${delMes.length} falla${delMes.length===1?'':'s'}. Su promedio es ${prom.toFixed(1).replace('.',',')} por mes.`});}
  // Tiempo entre fallas
  if(l.length>=3){const span=daysBetween(parseISO(l[l.length-1].fecha),parseISO(l[0].fecha));if(span>0)out.push({k:'info',t:`En promedio falla cada ${Math.round(span/(l.length-1))} días.`})}
  // Reparación más larga en los últimos 90 días
  const r90=l.filter(x=>daysBetween(parseISO(x.fecha),hoy)<=90&&horas(x)>0).sort((a,b)=>horas(b)-horas(a))[0];
  if(r90&&horas(r90)>=8)out.push({k:'info',t:`La parada más larga de los últimos 90 días fue de ${fmtH(horas(r90))} (${fmt(r90.fecha)}): ${sentence(r90.falla)}.`});
  // Registros sin causa
  const sj=l.filter(x=>SINJ.test(norm(x.falla))).length;
  if(sj>=2)out.push({k:'warn',t:`${sj} registros dicen "Sin justificación". Conviene detallar la causa para que el análisis sea más preciso.`});
  return out;
}

function mantTab(m){
  const ce=canEdit();
  const l=S.mantenimientos.filter(x=>x.maquinaId===m.id).sort(byNewest);
  const hoy=new Date(), ym=todayISO().slice(0,7), mesN=MESES[hoy.getMonth()];
  const delMes=l.filter(x=>String(x.fecha).startsWith(ym)), hMes=delMes.reduce((s,x)=>s+horas(x),0);
  const y=todayISO().slice(0,4), anio=l.filter(x=>String(x.fecha).startsWith(y)).length;
  const form=ce&&mantFormOpen?`<form class="mini-form" id="mantForm">
      <div class="field"><label for="mf_fecha">Fecha</label><input id="mf_fecha" type="date" required value="${todayISO()}" max="${todayISO()}"></div>

      <div class="mini-actions"><button type="button" class="btn small" id="mfCancel">Cancelar</button><button class="btn small primary">Guardar</button></div>
    </form>`:'';
  const ins=analisis(l);
  return `<div class="kpis"><div class="kpi"><b>${l.length}</b><span>fallas registradas</span></div><div class="kpi"><b>${anio}</b><span>en ${y}</span></div><div class="kpi"><b>${fmtH(hMes)}</b><span>en mantenimiento en ${mesN} (${delMes.length} falla${delMes.length===1?'':'s'})</span></div></div>
  <section class="hist">
    <div class="hist-head"><h3>Historial de mantenimientos</h3>${ce?`<button class="btn add-btn ${mantFormOpen?'on':''}" id="mfToggle" aria-expanded="${mantFormOpen}" title="Registrar falla" aria-label="Registrar falla">${mantFormOpen?'×':'+'}</button>`:`<button class="btn small" data-login>Iniciar sesión para registrar</button>`}</div>
    ${form}
    ${l.length?`<div class="tbl hist-tbl"><table><thead><tr><th>Fecha</th><th>Falla</th><th class="r">Horas</th>${ce?'<th></th>':''}</tr></thead><tbody>${l.map(x=>`<tr${String(x.fecha).startsWith(ym)?' class="cur"':''}><td class="num">${fmt(x.fecha)}</td><td class="falla">${esc(sentence(x.falla))}${x.obs?`<small class="muted">${esc(x.obs)}</small>`:''}</td><td class="num r">${x.tiempo===''||x.tiempo==null?'—':fmtH(+x.tiempo)}</td>${ce?`<td class="del"><button class="icon-del" data-delm="${x.id}" aria-label="Eliminar registro" title="Eliminar">×</button></td>`:''}</tr>`).join('')}</tbody></table></div>`:'<p class="empty">Sin fallas registradas para esta máquina.</p>'}
  </section>
  ${ins.length?`<section class="insights"><h3>Análisis de la máquina</h3><ul>${ins.map(i=>`<li class="${i.k}">${esc(i.t)}</li>`).join('')}</ul><p class="hint">Calculado con el historial de esta máquina. Se actualiza solo con cada registro.</p></section>`:''}`;
}
function pasTab(m){
  const ce=canEdit(), st=pasStatus(m.id), l=S.pasivados.filter(x=>x.maquinaId===m.id).sort((a,b)=>String(b.fecha).localeCompare(a.fecha));
  let big;
  if(st.k==='none')big=`<div class="status-big none"><div class="n">—</div><p><strong>Sin lavado pasivado registrado</strong>Registra la fecha del último lavado para empezar a contar el año.</p></div>`;
  else{const pct=Math.min(100,Math.max(0,st.since/365*100));
    big=`<div class="status-big ${st.k}"><div class="n">${st.k==='bad'?-st.left:st.left}</div><div style="flex:1;min-width:0"><p><strong>${st.k==='bad'?'días de retraso. Le toca lavado pasivado':'días para el próximo lavado'}</strong>Último: ${fmt(st.last)} · Próximo: ${fmtD(st.due)} · Van ${st.since} días</p><div class="progress" style="margin-top:8px"><span style="width:${pct}%"></span></div></div></div>`}
  return big+(ce?`<form class="boxed" id="pasForm"><h3 style="font-size:17px">Registrar lavado pasivado</h3><div class="form">
    <div class="field"><label for="pf_fecha">Fecha del lavado</label><input id="pf_fecha" type="date" required value="${todayISO()}" max="${todayISO()}"></div>
    <div class="field"><label for="pf_obs">Observación (opcional)</label><input id="pf_obs" placeholder="Proveedor, químico, etc."></div>
  </div><p class="hint">La norma pide un lavado por año. El conteo arranca desde la fecha más reciente registrada.</p><div class="row end"><button class="btn primary">Registrar lavado</button></div></form>`:loginHint('registrar lavados pasivados'))+
  (l.length?`<div class="tbl"><table><thead><tr><th>Fecha</th><th>Observación</th>${ce?'<th></th>':''}</tr></thead><tbody>${l.map(x=>`<tr><td class="num">${fmt(x.fecha)}</td><td>${esc(x.obs)||'<span class="muted">—</span>'}</td>${ce?`<td><button class="btn small danger" data-delp="${x.id}" aria-label="Eliminar registro">×</button></td>`:''}</tr>`).join('')}</tbody></table></div>`:'');
}
async function busy(btn,fn){if(btn){btn.disabled=true;btn.dataset.t=btn.textContent;btn.textContent='Guardando…'}
  try{return await fn()}finally{if(btn&&btn.isConnected){btn.disabled=false;btn.textContent=btn.dataset.t}}}
function bindPanel(m){
  const B=$('#pBody');
  B.querySelectorAll('[data-login]').forEach(b=>b.onclick=loginBox);
  const pb=$('#photoBtn'); if(pb)pb.onclick=()=>{$('#filePhoto').value='';$('#filePhoto').click()};
  const rp=$('#rmPhoto'); if(rp)rp.onclick=()=>confirmBox('¿Quitar la foto de esta máquina?','Quitar',async()=>{const {error}=await sb.from('hv_maquinas').update({foto_url:null}).eq('id',m.id);if(error)return toast(errMsg(error));m.foto='';renderAll();toast('Foto quitada')});
  const ei=$('#editInfo'); if(ei)ei.onclick=()=>{editInfo=true;renderPanel()};
  const ci=$('#cancelInfo'); if(ci)ci.onclick=()=>{editInfo=false;renderPanel()};
  const f=$('#infoForm'); if(f)f.onsubmit=e=>{e.preventDefault();
    const row={};FIELDS.forEach(([k,,t])=>{const v=f.elements[k].value;row[DBCOL[k]]=t==='number'?numOrNull(v):txtOrNull(v)});
    if(!row.nombre)return toast('El nombre es obligatorio');
    if(row.w==null)row.w=m.w; if(row.h==null)row.h=m.h;
    busy($('#saveInfo'),async()=>{const {data,error}=await sb.from('hv_maquinas').update(row).eq('id',m.id).select().single();
      if(error)return toast(errMsg(error));Object.assign(m,mapM(data));editInfo=false;renderAll();toast('Información guardada')});
  };
  const dm=$('#delMachine'); if(dm)dm.onclick=()=>confirmBox(`¿Eliminar ${esc(m.nombre)} con todos sus mantenimientos y lavados? No se puede deshacer.`,'Eliminar',async()=>{
    const {error}=await sb.from('hv_maquinas').delete().eq('id',m.id);if(error)return toast(errMsg(error));
    S.machines=S.machines.filter(x=>x.id!==m.id);S.mantenimientos=S.mantenimientos.filter(x=>x.maquinaId!==m.id);S.pasivados=S.pasivados.filter(x=>x.maquinaId!==m.id);closePanel();renderAll();toast('Máquina eliminada')});
  const mt=$('#mfToggle'); if(mt)mt.onclick=()=>{mantFormOpen=!mantFormOpen;renderPanel();if(mantFormOpen)$('#mf_falla').focus()};
  const mc=$('#mfCancel'); if(mc)mc.onclick=()=>{mantFormOpen=false;renderPanel()};
  const mf=$('#mantForm'); if(mf)mf.onsubmit=e=>{e.preventDefault();
    busy(mf.querySelector('.primary'),async()=>{const {data,error}=await sb.from('hv_mantenimientos').insert({maquina_id:m.id,fecha:$('#mf_fecha').value,falla:$('#mf_falla').value.trim(),tiempo_respuesta_h:numOrNull($('#mf_tiempo').value),observaciones:txtOrNull($('#mf_obs').value)}).select().single();
      if(error)return toast(errMsg(error));S.mantenimientos.push(mapMt(data));mantFormOpen=false;renderAll();toast('Falla registrada')})};
  const pf=$('#pasForm'); if(pf)pf.onsubmit=e=>{e.preventDefault();
    busy(pf.querySelector('.primary'),async()=>{const {data,error}=await sb.from('hv_pasivados').insert({maquina_id:m.id,fecha:$('#pf_fecha').value,observaciones:txtOrNull($('#pf_obs').value)}).select().single();
      if(error)return toast(errMsg(error));S.pasivados.push(mapP(data));renderAll();toast('Lavado pasivado registrado. El conteo del año arranca de nuevo.')})};
  B.querySelectorAll('[data-delm]').forEach(b=>b.onclick=()=>confirmBox('¿Eliminar este registro de mantenimiento?','Eliminar',async()=>{const {error}=await sb.from('hv_mantenimientos').delete().eq('id',b.dataset.delm);if(error)return toast(errMsg(error));S.mantenimientos=S.mantenimientos.filter(x=>x.id!==b.dataset.delm);renderAll();toast('Registro eliminado')}));
  B.querySelectorAll('[data-delp]').forEach(b=>b.onclick=()=>confirmBox('¿Eliminar este lavado pasivado?','Eliminar',async()=>{const {error}=await sb.from('hv_pasivados').delete().eq('id',b.dataset.delp);if(error)return toast(errMsg(error));S.pasivados=S.pasivados.filter(x=>x.id!==b.dataset.delp);renderAll();toast('Registro eliminado')}));
}

// Foto: se reduce a 1200 px y se sube al almacenamiento de Supabase
$('#filePhoto').onchange=e=>{
  const file=e.target.files[0]; const m=S.machines.find(x=>x.id===openId); if(!file||!m)return;
  const img=new Image(), url=URL.createObjectURL(file);
  img.onload=()=>{
    const k=Math.min(1,1200/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
    toast('Subiendo foto…');
    c.toBlob(async blob=>{
      const path=`${m.id}/${Date.now()}.jpg`;
      const up=await sb.storage.from('hv-maquinas').upload(path,blob,{contentType:'image/jpeg',upsert:false});
      if(up.error)return toast(errMsg(up.error));
      const pub=sb.storage.from('hv-maquinas').getPublicUrl(path).data.publicUrl;
      const {error}=await sb.from('hv_maquinas').update({foto_url:pub}).eq('id',m.id);
      if(error)return toast(errMsg(error));
      m.foto=pub;renderAll();toast('Foto actualizada');
    },'image/jpeg',.82);
  };
  img.onerror=()=>toast('No se pudo leer esa imagen. Prueba con JPG o PNG.');
  img.src=url;
};

/* ---------- Modales ---------- */
function openModal(html){$('#modal').innerHTML=html;$('#modal').hidden=false;$('#mScrim').hidden=false}
function closeModal(){$('#modal').hidden=true;$('#mScrim').hidden=true}
$('#mScrim').onclick=closeModal;
function confirmBox(text,label,fn){openModal(`<p style="margin:0;font-size:16px">${text}</p><div class="row end"><button class="btn" id="cNo">Cancelar</button><button class="btn primary" id="cYes">${label}</button></div>`);$('#cNo').onclick=closeModal;$('#cYes').onclick=()=>{closeModal();fn()};$('#cYes').focus()}
function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,3200)}

function nextCode(){const nums=S.machines.map(m=>parseInt(m.codigo)).filter(n=>!isNaN(n));return String((nums.length?Math.max(...nums):0)+1)}
$('#btnAdd').onclick=async()=>{
  const code=nextCode();
  const {data,error}=await sb.from('hv_maquinas').insert({codigo:code,nombre:'Máquina '+code,x:VW/2-60,y:VH-150,w:110,h:110}).select().single();
  if(error)return toast(errMsg(error));
  const m=mapM(data);S.machines.push(m);renderAll();openPanel(m.id);editInfo=true;renderPanel();toast('Máquina creada. Usa “Mover máquinas” para ubicarla.');
};

/* ---------- Descargar Excel ---------- */
$('#btnExport').onclick=()=>{
  if(typeof XLSX==='undefined')return toast('No cargó el generador de Excel. Revisa el internet.');
  const nom=id=>(S.machines.find(m=>m.id===id)||{}).nombre||'';
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(S.machines.map(m=>{const st=pasStatus(m.id);return {'Número':m.codigo,'Nombre':m.nombre,'Modelo':m.modelo,'Fabricante':m.fabricante,'Relación de baño':m.relacionBano,'# cuerdas':m.cuerdas,'Carga teórica (kg)':m.carga,'# tanques':m.tanques,'Litraje mínimo (L)':m.litrajeMin,'PLC':m.plc,'Último lavado pasivado':st.last||'','Estado pasivado':st.label}})),'Máquinas');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(S.mantenimientos.slice().sort((a,b)=>String(b.fecha).localeCompare(a.fecha)).map(x=>({'Máquina':nom(x.maquinaId),'Fecha':x.fecha,'Falla':x.falla,'Tiempo de respuesta (h)':x.tiempo,'Observaciones':x.obs}))),'Mantenimientos');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(S.pasivados.slice().sort((a,b)=>String(b.fecha).localeCompare(a.fecha)).map(x=>({'Máquina':nom(x.maquinaId),'Fecha':x.fecha,'Observación':x.obs}))),'Lavados pasivados');
  XLSX.writeFile(wb,'hoja-de-vida-maquinas-'+todayISO()+'.xlsx');
};

/* ---------- Importar Excel ---------- */
$('#btnImport').onclick=()=>{$('#fileXlsx').value='';$('#fileXlsx').click()};
const norm=s=>String(s??'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
const stripPre=s=>s.replace(/^(maquina|maq\.?|m)[\s#-]*0*/,'');
const keysOf=m=>[norm(m.nombre),m.codigo&&norm(m.codigo),m.codigo&&'maquina '+norm(m.codigo)].filter(Boolean);
function toISO(v){
  if(v instanceof Date&&!isNaN(v))return v.getFullYear()+'-'+String(v.getMonth()+1).padStart(2,'0')+'-'+String(v.getDate()).padStart(2,'0');
  if(typeof v==='number'){const d=new Date(Math.round((v-25569)*DAY));return toISO(new Date(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()))}
  const s=String(v||'').trim(); let r;
  if(r=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))return r[1]+'-'+r[2].padStart(2,'0')+'-'+r[3].padStart(2,'0');
  if(r=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/)){const y=r[3].length===2?'20'+r[3]:r[3];return y+'-'+r[2].padStart(2,'0')+'-'+r[1].padStart(2,'0')}
  return '';
}
function toHours(v){
  if(v instanceof Date&&!isNaN(v))return +(v.getHours()+v.getMinutes()/60).toFixed(2);
  if(typeof v==='number')return v;
  const s=String(v||'').trim(); let r;
  if(r=s.match(/^(\d{1,3}):(\d{2})/))return +(+r[1]+ +r[2]/60).toFixed(2);
  const n=parseFloat(s.replace(',','.')); if(isNaN(n))return null;
  return /min/i.test(s)?+(n/60).toFixed(2):n;
}
$('#fileXlsx').onchange=e=>{
  const file=e.target.files[0]; if(!file)return;
  if(typeof XLSX==='undefined'){toast('No cargó el lector de Excel. Revisa la conexión a internet.');return}
  const rd=new FileReader();
  rd.onload=()=>{let wb;try{wb=XLSX.read(rd.result,{type:'array',cellDates:true})}catch(err){toast('No se pudo leer el archivo');return}importDialog(wb)};
  rd.readAsArrayBuffer(file);
};
function importDialog(wb){
  let sheet=wb.SheetNames[0];
  const guess={maq:/maquina|equipo|activo/,fecha:/fecha/,falla:/falla|dano|descrip|problema|causa/,tiempo:/tiempo|respuesta|duracion|horas/,obs:/observ|accion|solucion|comentario/};
  const rows=()=>XLSX.utils.sheet_to_json(wb.Sheets[sheet],{header:1,raw:true,defval:''});
  function byKey(){const mp=new Map();S.machines.forEach(m=>keysOf(m).forEach(k=>mp.set(k,m)));return mp}
  const find=(mp,name)=>mp.get(norm(name))||mp.get(stripPre(norm(name)));
  function parse(r){
    const c=id=>+$('#'+id).value, iM=c('imMaq'),iF=c('imFecha'),iD=c('imFalla'),iT=c('imTiempo'),iO=c('imObs');
    const mp=byKey(), newNames=new Map(); let skip=0; const ok=[];
    r.slice(1).forEach(row=>{const maq=String(row[iM]??'').trim(), fecha=toISO(row[iF]), falla=String(row[iD]??'').trim();
      if(!maq||!fecha||!falla){if(row.some(v=>v!==''))skip++;return}
      if(!find(mp,maq))newNames.set(stripPre(norm(maq))||norm(maq),maq);
      ok.push({maq,fecha,falla,tiempo:toHours(row[iT]),obs:iO>=0?txtOrNull(row[iO]):null})});
    return {ok,newNames,skip};
  }
  function draw(){
    const r=rows(), hdr=(r[0]||[]).map(String);
    const pick=k=>hdr.findIndex(h=>guess[k].test(norm(h)));
    const sel=(id,k,opt)=>`<div class="field"><label for="${id}">${({maq:'Columna de máquina',fecha:'Columna de fecha del fallo',falla:'Columna de la falla',tiempo:'Columna de tiempo de respuesta',obs:'Columna de observaciones'})[k]}</label><select id="${id}">${opt?'<option value="-1">(ninguna)</option>':''}${hdr.map((h,i)=>`<option value="${i}" ${pick(k)===i?'selected':''}>${esc(h)||'Columna '+(i+1)}</option>`).join('')}</select></div>`;
    openModal(`<h2>Importar daños desde Excel</h2>
      <div class="form">${wb.SheetNames.length>1?`<div class="field full"><label for="imSheet">Hoja</label><select id="imSheet">${wb.SheetNames.map(n=>`<option ${n===sheet?'selected':''}>${esc(n)}</option>`).join('')}</select></div>`:''}
      ${sel('imMaq','maq')}${sel('imFecha','fecha')}${sel('imFalla','falla')}${sel('imTiempo','tiempo')}${sel('imObs','obs',true)}
      <div class="field full" style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" id="imCreate" style="width:auto"><label for="imCreate" style="font-size:14px;color:var(--fg)">Crear en el plano las máquinas que aún no existan</label></div></div>
      <p class="hint" id="imPreview"></p>
      <div class="row end"><button class="btn" id="imCancel">Cancelar</button><button class="btn primary" id="imGo">Importar</button></div>`);
    const s=$('#imSheet'); if(s)s.onchange=()=>{sheet=s.value;draw()};
    $('#imCancel').onclick=closeModal;
    const prev=()=>{const p=parse(r);const nn=[...p.newNames.values()];$('#imPreview').innerHTML=`${Math.max(0,r.length-1)} filas en la hoja · <b>${p.ok.length}</b> con máquina, fecha y falla${nn.length?` · <b>${nn.length}</b> máquinas no están en el plano: ${esc(nn.slice(0,8).join(', '))}${nn.length>8?'…':''}. Si no marcas la casilla, esas filas se omiten.`:''}${p.skip?` · ${p.skip} filas incompletas se omiten`:''}`};
    ['imMaq','imFecha','imFalla','imTiempo','imObs'].forEach(id=>$('#'+id).onchange=prev); prev();
    $('#imGo').onclick=()=>busy($('#imGo'),async()=>{
      const p=parse(r), create=$('#imCreate').checked;
      if(create&&p.newNames.size){
        let k=S.machines.length;
        const rowsNew=[...p.newNames.values()].map(n=>({nombre:n,codigo:null,x:40+(k++%6)*160,y:VH-140,w:110,h:110}));
        const {data,error}=await sb.from('hv_maquinas').insert(rowsNew).select();
        if(error)return toast(errMsg(error));
        data.forEach(d=>S.machines.push(mapM(d)));
      }
      const mp=byKey(), seen=new Set(S.mantenimientos.map(x=>x.maquinaId+'|'+x.fecha+'|'+norm(x.falla)));
      const ins=[];let dup=0,miss=0;
      p.ok.forEach(x=>{const m=find(mp,x.maq);if(!m){miss++;return}const key=m.id+'|'+x.fecha+'|'+norm(x.falla);if(seen.has(key)){dup++;return}seen.add(key);ins.push({maquina_id:m.id,fecha:x.fecha,falla:x.falla,tiempo_respuesta_h:x.tiempo,observaciones:x.obs})});
      let added=0;
      for(let i=0;i<ins.length;i+=500){
        const {data,error}=await sb.from('hv_mantenimientos').insert(ins.slice(i,i+500)).select();
        if(error){toast(`Se importaron ${added} registros y luego falló: ${errMsg(error)}`);await load();return}
        data.forEach(d=>S.mantenimientos.push(mapMt(d)));added+=data.length;
      }
      closeModal();renderAll();
      toast(`${added} registros importados${dup?` · ${dup} repetidos omitidos`:''}${miss?` · ${miss} sin máquina en el plano`:''}`);
    });
  }
  draw();
}

/* ---------- Inicio ---------- */
renderAuth();renderPlan();
sb.auth.getSession().then(async({data})=>{user=data.session?data.session.user:null;await loadPerfil();renderAuth();await load()});
})();
